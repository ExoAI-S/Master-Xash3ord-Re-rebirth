bind "1" "quickslot weapon"
bind "2" "quickslot spell"
bind "3" "inventory"
bind "4" "quickslot arrow"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
log off

// Press P to toggle the Inventory / Character / World Map menu.
bind "p" "inventory"

// Classic sheath/use and pickup controls; retain all other saved bindings.
bind "q" "use"
bind "e" "+use"
alias +getuse "get;+use"
alias -getuse "-use"
bind "MOUSE4" "+getuse"
