// MSR GoldSrc Masterpiece - conservative 1440p quality profile
// Target: GeForce RTX 5070, Ryzen 7 9700X, 2560x1440 / 143 Hz
// Opt in with: +exec masterpiece.cfg
// This file intentionally does not change controls, sensitivity, audio volume,
// brightness, gamma, player identity, networking, or gameplay movement values.

// Keep classic GoldSrc timing inside its supported ceiling.
fps_override "0"
fps_max "100"
gl_vsync "0"

// Preserve source texture detail without speculative renderer toggles.
gl_ansio "16"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_max_size "512"
gl_picmip "0"
gl_dither "1"
gl_keeptjunctions "1"
gl_lightholes "1"
gl_spriteblend "1"
gl_fog "1"
gl_wateramp "0"
r_detailtextures "1"
cl_himodels "1"

// MSR renderer features exposed by the currently shipped Steam client.
ms_reflect "1"
ms_reflect_dbg "0"
ms_showotherglow "1"

// Dense but bounded impact decals for the two-map showcase.
sp_decals "4096"
mp_decals "300"

// Clean presentation and stable high-quality audio buffering.
cl_showfps "0"
net_graph "0"
_snd_mixahead "0.1"
hisound "1"
room_off "0"

// Never enable diagnostic or experimental execution paths in this profile.
developer "0"
ms_developer "0"
